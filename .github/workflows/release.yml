name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release as (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI and app
        run: make all

      - name: Verify artifacts
        run: |
          ./dist/displayarrange --help
          plutil -lint dist/DisplayArrange.app/Contents/Info.plist

      - name: Package artifacts
        run: |
          cd dist
          zip -9 -y DisplayArrange-macos-arm64.zip displayarrange
          ditto -c -k --sequesterRsrc --keepParent DisplayArrange.app DisplayArrange.app.zip
          shasum -a 256 *.zip > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/DisplayArrange-macos-arm64.zip
            dist/DisplayArrange.app.zip
            dist/SHA256SUMS.txt
